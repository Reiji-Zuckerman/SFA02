<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFA02 - 営業支援システム</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- 簡易パスワード認証 -->
  <div id="auth-gate" style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">
    <div style="text-align:center;background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:360px;width:100%;">
      <h2 style="margin-bottom:1rem;font-size:1.25rem;">SFA02 - 営業支援システム</h2>
      <p style="color:#666;margin-bottom:1rem;font-size:.9rem;">パスワードを入力してください</p>
      <input id="auth-password" type="password" placeholder="パスワード"
        style="width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;margin-bottom:.75rem;font-size:1rem;"
        onkeydown="if(event.key==='Enter')document.getElementById('auth-submit').click()">
      <button id="auth-submit" onclick="checkAuth()"
        style="width:100%;padding:.5rem;background:#0d6efd;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer;">
        ログイン
      </button>
      <p id="auth-error" style="color:red;margin-top:.5rem;font-size:.85rem;display:none;">パスワードが違います</p>
    </div>
  </div>
  <script>
    // パスワードはここで変更できます
    var AUTH_PASSWORD = 'sfa02';
    function checkAuth() {
      var input = document.getElementById('auth-password').value;
      if (input === AUTH_PASSWORD) {
        sessionStorage.setItem('sfa02_auth', '1');
        showApp();
      } else {
        document.getElementById('auth-error').style.display = 'block';
      }
    }
    function showApp() {
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('app').style.display = '';
    }
    // セッション中は再入力不要
    if (sessionStorage.getItem('sfa02_auth') === '1') {
      document.addEventListener('DOMContentLoaded', function() { showApp(); });
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('app').style.display = 'none';
      });
    }
  </script>

  <div id="app"></div>

  <!-- Vue.js 3 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>

  <!-- App Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils/filters.js"></script>
  <script src="js/utils/pagination.js"></script>
  <script src="js/utils/csv.js"></script>

  <!-- Components -->
  <script src="js/components/FilterSave.js"></script>
  <script src="js/components/ColumnToggle.js"></script>
  <script src="js/components/Sidebar.js"></script>
  <script src="js/components/TaskList.js"></script>
  <script src="js/components/CompanyList.js"></script>
  <script src="js/components/CompanyDetail.js"></script>
  <script src="js/components/MeetingList.js"></script>
  <script src="js/components/ProjectList.js"></script>
  <script src="js/components/ProjectDetail.js"></script>
  <script src="js/components/JobList.js"></script>
  <script src="js/components/Dashboard.js"></script>
  <script src="js/components/MemberList.js"></script>

  <!-- Modals -->
  <script src="js/components/modals/CompanyModal.js"></script>
  <script src="js/components/modals/DepartmentModal.js"></script>
  <script src="js/components/modals/ContactModal.js"></script>
  <script src="js/components/modals/ContractLineModal.js"></script>
  <script src="js/components/modals/MeetingModal.js"></script>
  <script src="js/components/modals/ProjectModal.js"></script>
  <script src="js/components/modals/JobModal.js"></script>
  <script src="js/components/modals/TaskModal.js"></script>

  <!-- Main App (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
